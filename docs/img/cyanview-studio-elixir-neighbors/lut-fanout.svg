<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" font-family="Outfit, -apple-system, Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#0d1117" rx="16"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b98a5"/></marker></defs>
<style>.t{fill:#e6edf3;font-size:28px}.h{fill:#ffffff;font-size:32px;font-weight:600}.d{fill:#8b98a5;font-size:22px}.m{font-family:"JetBrains Mono",Menlo,monospace;font-size:22px;fill:#6dc9f3}.n{font-family:"JetBrains Mono",Menlo,monospace;font-size:24px;fill:#34d399}.box{fill:none;stroke:#8b98a5;stroke-width:3;rx:14}.cy{stroke:#6dc9f3}.gr{stroke:#34d399}.pu{stroke:#a78bfa}.ar{stroke:#8b98a5;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<rect x="40" y="60" width="240" height="120" class="box cy"/><text x="70" y="110" class="h">Slider</text><text x="70" y="150" class="d">LiveView, 60 Hz</text>
<rect x="340" y="60" width="300" height="120" class="box cy"/><text x="370" y="110" class="h">ETS overlay</text><text x="370" y="150" class="n">~10 µs write</text>
<rect x="700" y="60" width="380" height="120" class="box cy"/><text x="730" y="110" class="h">Fanout GenServer</text><text x="730" y="150" class="d">1 job in flight · newest wins</text>
<rect x="1140" y="60" width="420" height="120" class="box cy"/><text x="1170" y="110" class="h">Task.async_stream</text><text x="1170" y="150" class="d">max_concurrency = schedulers</text>
<path d="M280 120 H340" class="ar"/><path d="M640 120 H700" class="ar"/><path d="M1080 120 H1140" class="ar"/>
<path d="M1350 180 V240 H120 V290" class="ar"/>
<defs><g id="row"><rect x="40" y="0" width="280" height="90" class="box"/><text x="60" y="38" class="t">resolve chain</text><text x="60" y="72" class="n">0.07 ms</text>
<rect x="380" y="0" width="280" height="90" class="box gr"/><text x="400" y="38" class="t">C dirty NIF</text><text x="400" y="72" class="n">0.57 ms at 33³</text>
<rect x="720" y="0" width="300" height="90" class="box"/><text x="740" y="38" class="t">device process</text><text x="740" y="72" class="d">cast, zero copy</text>
<rect x="1080" y="0" width="480" height="90" class="box pu"/><text x="1100" y="38" class="t">wire</text><text x="1180" y="38" class="m">WS · TCP · REST+WS</text><text x="1100" y="72" class="d">431 KB at 33³</text>
<path d="M320 45 H380" class="ar"/><path d="M660 45 H720" class="ar"/><path d="M1020 45 H1080" class="ar"/></g></defs>
<use href="#row" y="290"/><use href="#row" y="410"/><use href="#row" y="530"/>
<text x="40" y="670" class="t">⋮   one task per camera or colour box, no barrier: each ships the instant its NIF returns</text>
<text x="40" y="740" class="h">Measured: 0.85 ms per box at 33³, 16 boxes in 9.6 ms.</text>
<text x="1080" y="740" class="d">10 warm-up + 200 timed runs</text>
</svg>
