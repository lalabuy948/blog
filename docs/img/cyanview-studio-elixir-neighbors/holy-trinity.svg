<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 870" font-family="Outfit, -apple-system, Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#0d1117" rx="16"/>
<defs>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#34d399" stop-opacity="0.22"/><stop offset="100%" stop-color="#34d399" stop-opacity="0"/></radialGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b98a5"/></marker>
</defs>
<style>.h{fill:#ffffff;font-size:40px;font-weight:700}.s{font-size:22px;letter-spacing:3px;font-family:"JetBrains Mono",Menlo,monospace}.t{fill:#e6edf3;font-size:26px}.d{fill:#8b98a5;font-size:22px}.dr{fill:#8b98a5;font-size:22px;text-anchor:end}.c{fill:#ffffff;font-size:30px;font-weight:700;text-anchor:middle}.cm{fill:#34d399;font-size:22px;text-anchor:middle}.box{fill:#000;stroke-width:3;rx:18}.ed{stroke:#8b98a5;stroke-width:3;fill:none;marker-end:url(#a);marker-start:url(#a)}</style>
<path d="M650 265 L330 560" class="ed"/>
<path d="M950 265 L1270 560" class="ed"/>
<path d="M560 700 H1040" class="ed" stroke-dasharray="10 8"/>
<circle cx="800" cy="440" r="210" fill="url(#glow)"/>
<circle cx="800" cy="440" r="125" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4 6"/>
<text x="800" y="430" class="c">one operator</text>
<text x="800" y="468" class="c">one look</text>
<rect x="520" y="20" width="560" height="245" class="box" stroke="#6dc9f3"/>
<text x="550" y="70" class="s" fill="#6dc9f3">SOFTWARE · NEW</text>
<text x="550" y="120" class="h">Unites them</text>
<text x="550" y="165" class="t">CyanView Studio + the dashboard</text>
<text x="550" y="205" class="t">node graphs · scopes · live fades</text>
<text x="550" y="237" class="d">one grade drives sensor and LUT together</text>
<rect x="40" y="560" width="520" height="280" class="box" stroke="#f59e0b"/>
<text x="70" y="600" class="s" fill="#f59e0b">CAMERA CONTROL</text>
<text x="70" y="650" class="h">The sensor</text>
<text x="70" y="695" class="t">iris · gain · ND · shutter</text>
<text x="70" y="735" class="t">white balance · knee · matrix</text>
<text x="70" y="775" class="d">RCP panels, 73 dashboard controls</text>
<text x="70" y="805" class="d">where CyanView started</text>
<rect x="1040" y="560" width="520" height="280" class="box" stroke="#a78bfa"/>
<text x="1070" y="600" class="s" fill="#a78bfa">COLOUR BOXES</text>
<text x="1070" y="650" class="h">The final look</text>
<text x="1070" y="695" class="t">a 3D LUT per feed</text>
<text x="1070" y="735" class="t">AJA · BoxIO · VP4 · iVP</text>
<text x="1070" y="775" class="d">and CyanCamera on the phone</text>
<text x="1070" y="805" class="d">where the look lands</text>
<text x="440" y="378" class="dr">sensor values</text>
<text x="440" y="408" class="dr">MQTT to the cameras</text>
<text x="1160" y="378" class="d">a LUT per box</text>
<text x="1160" y="408" class="d">0.85 ms each, with fades</text>
<text x="800" y="685" class="cm" fill="#8b98a5">sensor → SDI → LUT → on air</text>
</svg>
