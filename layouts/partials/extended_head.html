{{ if in (slice "curated" "tools") .Section }}
  {{ with resources.Get "css/curated.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ .RelPermalink }}">
  {{ end }}
  <script>
    // the build-time text goes stale between deploys
    addEventListener('DOMContentLoaded', () => {
      const now = new Date();
      document.querySelectorAll('time.curated-owned').forEach((t) => {
        const d = new Date(t.dateTime);
        const m = (now.getFullYear() - d.getUTCFullYear()) * 12 + now.getMonth() - d.getUTCMonth() - (now.getDate() < d.getUTCDate() ? 1 : 0);
        const dur = m >= 24 ? `${Math.floor(m / 12)} yrs` : m >= 12 ? (m % 12 ? `1 yr ${m % 12} mo` : '1 yr') : m >= 1 ? `${m} mo` : '';
        t.querySelector('span').textContent = dur && ` · ${dur}`;
      });
    });
  </script>
{{ end }}
